<section class="brand-container">
  <button
    (click)="toggleAbout()"
    [attr.aria-expanded]="isExpanded()"
    class="brand-button"
    type="button"
  >
    <svg
      viewBox="0 0 36 28"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      class="brand-icon"
    >
      <path
        class="logo-layer layer1"
        d="M4 4 L14 4 L24 14 L24 24 L14 24 L4 14 Z"
        fill="currentColor"
        opacity="0.9"
      />

      <path
        class="logo-layer layer2"
        d="M12 0 L22 0 L32 10 L32 20 L22 20 L12 10 Z"
        fill="currentColor"
        opacity="0.7"
      />

      <path
        class="logo-layer layer3"
        d="M20 4 L30 4 L30 14 L20 14 Z"
        fill="currentColor"
      />
    </svg>

    <span class="brand-title"> NNG </span>
  </button>

  <section class="about-panel" [class.expanded]="isExpanded()">
    <p class="about-text">
      {{ getText( aboutContent) }}
    </p>
  </section>

  <section class="navigation-container">
    
    <!-- 
    <a routerLink="/projects" class="nav-button">Projects</a>
     -->

    <a routerLink="/credentials" class="nav-button">Credentials</a>

    
  </section>
</section>
