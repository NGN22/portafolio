<section class="projects">

  <header class="projects__header">

    <h1>
      {{ getText(title) }}
    </h1>

    <p>
      {{ getText(descripcion) }}
    </p>

  </header>

  <section class="projects__grid">

    @for (
      project of projects();
      track project.id
    ) {

      <app-project-card
        [project]="project">
      </app-project-card>

    }

  </section>

</section>
